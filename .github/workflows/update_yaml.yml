name: Scrape index

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1,4"   # Twice a week at 01:00 UTC (2 hours before 03:00 UTC)

jobs:
  scrape-index:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run scrape index
        run: |
          python scrape_index.py

      - name: Save updated feeds.yaml
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add feeds.yaml
          git commit -m "Update feeds.yaml" || exit 0
          git push
